spring:
  application:
    name: synapse-saas
  datasource:
    # JDBC form of the reference's SYNAPSE_DATABASE_URL (postgresql+asyncpg://… → jdbc:postgresql://…)
    url: ${SYNAPSE_JDBC_URL:jdbc:postgresql://localhost:5433/synapse}
    username: ${SYNAPSE_DB_USER:synapse}
    password: ${SYNAPSE_DB_PASSWORD:synapse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema comes from Flyway (V1__baseline.sql = contracts/schema-v1.sql), never from entities
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /
      path-mapping:
        prometheus: metrics

synapse:
  version: 0.1.0
  billing-provider: ${SYNAPSE_BILLING_PROVIDER:manual}
  identity-provider: ${SYNAPSE_IDENTITY_PROVIDER:local}
  tenant-isolation: ${SYNAPSE_TENANT_ISOLATION:app}
