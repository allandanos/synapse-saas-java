spring:
  application:
    name: synapse-saas
  datasource:
    # JDBC form of the reference's SYNAPSE_DATABASE_URL (postgresql+asyncpg://… → jdbc:postgresql://…)
    url: ${SYNAPSE_JDBC_URL:jdbc:postgresql://localhost:5433/synapse}
    username: ${SYNAPSE_DB_USER:synapse}
    password: ${SYNAPSE_DB_PASSWORD:synapse}
    hikari:
      # `timestamp without time zone` defaults (now()) follow the session zone; the reference's are UTC
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true   # schema comes from V1__baseline.sql (= contracts/schema-v1.sql), never from code
    # The baseline is a pg_dump in dump order: SQL-language functions (synapse_org_for_invite_token,
    # synapse_org_for_provider_ref) precede the tables they read, which only applies with body checks off.
    init-sqls:
      - SET check_function_bodies = false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # The 10 MiB direct-upload cap is enforced in code (the reference's 400 storage_error,
      # not the container's 413), so the container limit sits just above it.
      max-file-size: 12MB
      max-request-size: 16MB
  mvc:
    problemdetails:
      enabled: false   # problem documents are rendered by dev.synapse.core.problem (application/json, reference shape)

server:
  port: ${PORT:8080}
  error:
    include-message: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /
      path-mapping:
        prometheus: metrics

# Every key below also binds from the environment as SYNAPSE_<KEY> (relaxed binding),
# the same names the reference implementation reads.
synapse:
  version: 0.1.0
  env: ${SYNAPSE_ENV:development}
  billing-provider: ${SYNAPSE_BILLING_PROVIDER:manual}
  identity-provider: ${SYNAPSE_IDENTITY_PROVIDER:local}
  tenant-isolation: ${SYNAPSE_TENANT_ISOLATION:app}
  secret-key: ${SYNAPSE_SECRET_KEY:dev-only-secret-key-change-me-32-bytes-minimum!}
  access-token-ttl-minutes: ${SYNAPSE_ACCESS_TOKEN_TTL_MINUTES:15}
  refresh-token-ttl-days: ${SYNAPSE_REFRESH_TOKEN_TTL_DAYS:30}
  refresh-reuse-grace-seconds: ${SYNAPSE_REFRESH_REUSE_GRACE_SECONDS:10}
  web-origin: ${SYNAPSE_WEB_ORIGIN:http://localhost:3000}
  web-origins: ${SYNAPSE_WEB_ORIGINS:}
  cookie-secure: ${SYNAPSE_COOKIE_SECURE:}
  bootstrap-admin-email: ${SYNAPSE_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${SYNAPSE_BOOTSTRAP_ADMIN_PASSWORD:}
  # Plan catalog: the packaged copy of the reference's config/plans.yaml unless SYNAPSE_PLANS_FILE points elsewhere
  plans-file: ${SYNAPSE_PLANS_FILE:classpath:config/plans.yaml}
  auto-sync-plans: ${SYNAPSE_AUTO_SYNC_PLANS:true}
  default-plan-key: ${SYNAPSE_DEFAULT_PLAN_KEY:free}
  grace-on-past-due: ${SYNAPSE_GRACE_ON_PAST_DUE:true}
  billing-currency: ${SYNAPSE_BILLING_CURRENCY:PHP}
  stripe-secret-key: ${SYNAPSE_STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${SYNAPSE_STRIPE_WEBHOOK_SECRET:}
  paddle-secret-key: ${SYNAPSE_PADDLE_SECRET_KEY:}
  paddle-webhook-secret: ${SYNAPSE_PADDLE_WEBHOOK_SECRET:}
  xendit-secret-key: ${SYNAPSE_XENDIT_SECRET_KEY:}
  xendit-webhook-token: ${SYNAPSE_XENDIT_WEBHOOK_TOKEN:}
  paymongo-secret-key: ${SYNAPSE_PAYMONGO_SECRET_KEY:}
  paymongo-webhook-secret: ${SYNAPSE_PAYMONGO_WEBHOOK_SECRET:}
  manual-webhook-token: ${SYNAPSE_MANUAL_WEBHOOK_TOKEN:}
  manual-pay-to-instructions: ${SYNAPSE_MANUAL_PAY_TO_INSTRUCTIONS:}
  # Notifications: "smtp" sends through the relay when a host is set, "noop" always logs only
  notifier: ${SYNAPSE_NOTIFIER:smtp}
  smtp-host: ${SYNAPSE_SMTP_HOST:}
  smtp-port: ${SYNAPSE_SMTP_PORT:1025}
  smtp-from: ${SYNAPSE_SMTP_FROM:synapse@localhost}
  smtp-username: ${SYNAPSE_SMTP_USERNAME:}
  smtp-password: ${SYNAPSE_SMTP_PASSWORD:}
  smtp-tls: ${SYNAPSE_SMTP_TLS:none}
  # Storage: any S3-compatible bucket (AWS, R2, MinIO) when SYNAPSE_S3_BUCKET is set, local disk otherwise
  s3-endpoint-url: ${SYNAPSE_S3_ENDPOINT_URL:}
  s3-region: ${SYNAPSE_S3_REGION:us-east-1}
  s3-bucket: ${SYNAPSE_S3_BUCKET:}
  s3-access-key-id: ${SYNAPSE_S3_ACCESS_KEY_ID:}
  s3-secret-access-key: ${SYNAPSE_S3_SECRET_ACCESS_KEY:}
  storage-root: ${SYNAPSE_STORAGE_ROOT:.storage}
  # Worker: the cron jobs run in-process with the API unless this is off
  worker-enabled: ${SYNAPSE_WORKER_ENABLED:true}
  audit-retention-days: ${SYNAPSE_AUDIT_RETENTION_DAYS:365}
  storage-presign-seconds: ${SYNAPSE_STORAGE_PRESIGN_SECONDS:3600}
  # Redis: versioned caches, the auth rate limiter and the OIDC login state.
  # Unset ⇒ per-process (single instance only); /readyz reports not_configured.
  redis-url: ${SYNAPSE_REDIS_URL:}
  # Auth rate limiting: attempts per fixed window, per client IP and per target identity
  auth-rate-limit-per-ip: ${SYNAPSE_AUTH_RATE_LIMIT_PER_IP:20}
  auth-rate-limit-per-identity: ${SYNAPSE_AUTH_RATE_LIMIT_PER_IDENTITY:5}
  auth-rate-window-seconds: ${SYNAPSE_AUTH_RATE_WINDOW_SECONDS:60}
  # CIDRs whose X-Forwarded-For may be believed; empty ⇒ the header is ignored outright
  trusted-proxies: ${SYNAPSE_TRUSTED_PROXIES:}
  # Authorization backend (ADR 0009): rbac reads the Postgres tables, openfga asks the store
  authz-backend: ${SYNAPSE_AUTHZ_BACKEND:rbac}
  openfga-url: ${SYNAPSE_OPENFGA_URL:}
  openfga-store-id: ${SYNAPSE_OPENFGA_STORE_ID:}
  openfga-model-id: ${SYNAPSE_OPENFGA_MODEL_ID:}
  openfga-api-token: ${SYNAPSE_OPENFGA_API_TOKEN:}
  openfga-fail-mode: ${SYNAPSE_OPENFGA_FAIL_MODE:closed}
  # OIDC (ADR 0010): SYNAPSE_IDENTITY_PROVIDER=keycloak turns the SSO routes on
  keycloak-base-url: ${SYNAPSE_KEYCLOAK_BASE_URL:}
  keycloak-realm: ${SYNAPSE_KEYCLOAK_REALM:}
  keycloak-client-id: ${SYNAPSE_KEYCLOAK_CLIENT_ID:}
  keycloak-client-secret: ${SYNAPSE_KEYCLOAK_CLIENT_SECRET:}
  keycloak-allow-password-grant: ${SYNAPSE_KEYCLOAK_ALLOW_PASSWORD_GRANT:false}
  oidc-redirect-uri: ${SYNAPSE_OIDC_REDIRECT_URI:}

logging:
  level:
    dev.synapse: INFO
